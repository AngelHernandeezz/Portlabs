<!-- Faro ENCENDIDO: se muestra cuando la contraseña está visible.
     Es el mismo dibujo que el apagado, pero con la lámpara rellena y los rayos de luz en ámbar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#164f70" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest">

    <!-- Lámpara encendida: relleno ámbar, sin borde. Va primero para quedar detrás de las líneas -->
    <rect x="10.5" y="6.5" width="3" height="3.5" fill="#f5b301" stroke="none" />

    <!-- Rayos de luz a izquierda y derecha -->
    <path d="M8 6L3 4.5M8 8.2L3 8.2M16 6L21 4.5M16 8.2L21 8.2" stroke="#f5b301" />

    <!-- Base del faro -->
    <path d="M6 21H18" />

    <!-- Torre: más ancha abajo que arriba -->
    <path d="M8 21L9.5 10H14.5L16 21" />

    <!-- Franja de la torre -->
    <path d="M8.8 15.5H15.2" />

    <!-- Cabina de la lámpara -->
    <path d="M10.5 10V6.5H13.5V10" />

    <!-- Tejado -->
    <path d="M9.5 6.5L12 3.5L14.5 6.5Z" />
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
