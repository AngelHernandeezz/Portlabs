<!-- Faro APAGADO: se muestra cuando la contraseña está oculta.
     xmlns es obligatorio para que el navegador lo abra como imagen desde <img>.
     viewBox="0 0 24 24" = lienzo de 24x24; luego el CSS lo escala al tamaño que queramos.
     Aquí el color va escrito dentro del archivo (stroke), porque desde <img> el CSS no puede cambiarlo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#526d7e" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest">

    <!-- Base del faro -->
    <path d="M6 21H18" />

    <!-- Torre: más ancha abajo que arriba -->
    <path d="M8 21L9.5 10H14.5L16 21" />

    <!-- Franja de la torre -->
    <path d="M8.8 15.5H15.2" />

    <!-- Cabina de la lámpara, vacía porque está apagada -->
    <path d="M10.5 10V6.5H13.5V10" />

    <!-- Tejado -->
    <path d="M9.5 6.5L12 3.5L14.5 6.5Z" />
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
